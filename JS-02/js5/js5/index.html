<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión del Zoológico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Helvetica+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Helvetica Neue', sans-serif;
    }

    h1, h2 {
      font-family: 'Pacifico', cursive;
      color: #343a40;
      text-align: center;
      margin-bottom: 2rem;
    }

    .card {
      background-color: #fff;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      margin-bottom: 1.5rem;
    }

    .card-header {
      background-color: #e9ecef;
      font-weight: bold;
    }

    .resultado-filtro {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .resultado-filtro.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .btn {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container py-4">

    <h1>Gestión del Zoológico</h1>

    <!-- Configuración inicial -->
    <div class="card">
      <div class="card-header">Configuración inicial</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <input type="number" class="form-control" placeholder="Cantidad de jaulas" id="inputJaulas" />
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-success" onclick="crearJaulas()">Crear jaulas</button>
          </div>
        </div>
        <div class="row g-3 mt-3">
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="Nuevo tipo de animal" id="nuevoTipo" />
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-warning" onclick="agregarTipo()">Agregar tipo</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario animal -->
    <div class="card">
      <div class="card-header">Agregar Animal</div>
      <div class="card-body">
        <form id="formAnimal" class="row g-3">
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="ID" id="idAnimal" required />
          </div>
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="Nombre" id="nombre" required />
          </div>
          <div class="col-md-2">
            <select class="form-select" id="jaula" required>
              <option value="">Seleccione jaula</option>
            </select>
          </div>
          <div class="col-md-2">
            <select class="form-select" id="tipoAnimal" required></select>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control" placeholder="Peso (kg)" step="0.01" id="peso" required />
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Agregar Animal</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Filtros -->
    <div class="card">
      <div class="card-header">Filtros</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Jaula y Peso (Menor a...)</label>
            <select class="form-select mb-1" id="jaulaFiltro1">
              <option value="">Seleccione jaula</option>
            </select>
            <input type="number" class="form-control" id="pesoFiltro1" placeholder="Peso máx" />
            <button class="btn btn-secondary mt-2" onclick="filtrarAnimalesPeso()">Filtrar</button>
            <div id="resultadoFiltroPeso" class="resultado-filtro mt-2"></div>
          </div>

          <div class="col-md-4">
            <label class="form-label">Tipo y Rango de Jaulas</label>
            <select class="form-select mb-1" id="tipoFiltro"></select>
            <select class="form-select mb-1" id="jaulaDesde">
              <option value="">Desde jaula</option>
            </select>
            <select class="form-select" id="jaulaHasta">
              <option value="">Hasta jaula</option>
            </select>
            <button class="btn btn-secondary mt-2" onclick="filtrarTipoYJaula()">Filtrar</button>
            <div id="resultadoFiltroTipo" class="resultado-filtro mt-2"></div>
          </div>

          <div class="col-md-4">
            <label class="form-label">Animal de menor peso en Jaula</label>
            <select class="form-select mb-1" id="jaulaFiltro2">
              <option value="">Seleccione jaula</option>
            </select>
            <input type="number" class="form-control" id="pesoFiltro2" placeholder="Peso máximo" />
            <button class="btn btn-secondary mt-2" onclick="animalMenorPeso()">Buscar</button>
            <div id="resultadoAnimalMenor" class="resultado-filtro mt-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón extra -->
    <div class="card">
      <div class="card-body">
        <button class="btn btn-success" onclick="mostrarConDocumentWrite()">Mostrar todo con document.write()</button>
      </div>
    </div>

    <h2>Animales Registrados</h2>
    <div id="tablaAnimales" class="table-responsive"></div>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
