<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión del Zoológico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Helvetica+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="container py-4">

    <h1>Gestión del Zoológico</h1>

    <!--Añadiduras para el usaurio-->
    <div class="card">
      <div class="card-header">Configuración inicial</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <input type="number" class="form-control" placeholder="Cantidad de jaulas" id="inputJaulas" />
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-primary" onclick="crearJaulas()">Crear jaulas</button>
          </div>
        </div>
        <div class="row g-3 mt-3">
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="Nuevo tipo de animal" id="nuevoTipo" />
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-primary" onclick="agregarTipo()">Agregar tipo</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario-->
    <div class="card">
      <div class="card-header">Agregar Animal</div>
      <div class="card-body">
        <form id="formAnimal" class="row g-3">
          
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="Nombre" id="nombre" required />
          </div>
          <div class="col-md-2">
            <select class="form-select" id="jaula" required>
              <option value="">Seleccione jaula</option>
            </select>
          </div>
          <div class="col-md-2">
            <select class="form-select" id="tipoAnimal" required></select>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control" placeholder="Peso (kg)" step="0.01" id="peso" required />
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Agregar Animal</button>
          </div>
          <div class="col-md-2 d-grid">
            <button type="button" class="btn btn-primary" onclick="mostrarConDocumentWrite()">Ver filtros</button>
          </div>
        </form>
      </div>
    </div>
    
    <div id="tablaAnimales" class="table-responsive"></div>

  </div>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
