
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuarios API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center mb-4">Agregar Usuario</h2>
    <form id="formUsuario" class="mb-4">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success">Enviar</button>
    </form>
    <div id="respuesta" class="alert alert-info d-none"></div>

    <hr class="my-5">
    <h3 class="text-center mb-3">Lista de Usuarios</h3>
    <div id="listaUsuarios" class="row"></div>
  </div>

  <script src="script/script.js"></script>
</body>
</html>
