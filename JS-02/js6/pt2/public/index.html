<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuarios con POST y LocalStorage</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center mb-4">Enviar Nuevo Usuario</h2>

    <form id="formUsuario" class="mb-4">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required />
      </div>

      <button type="submit" class="btn btn-success">Agregar Usuario</button>
    </form>

    <div id="respuesta" class="alert alert-info d-none"></div>

    <hr class="my-5" />

    <h3 class="text-center mb-3">Usuarios Originales de la API</h3>
    <div id="usuariosApi" class="row"></div>

    <hr class="my-5" />

    <h3 class="text-center mb-3">Usuarios Enviados Manualmente (Guardados)</h3>
    <div id="usuariosNuevos" class="row"></div>
  </div>

  <script>
    const form = document.getElementById("formUsuario");
    const respuestaDiv = document.getElementById("respuesta");
    const usuariosApiDiv = document.getElementById("usuariosApi");
    const usuariosNuevosDiv = document.getElementById("usuariosNuevos");

    // Recuperar del localStorage o iniciar vacío
    let usuariosNuevos = JSON.parse(localStorage.getItem("usuariosNuevos")) || [];

    // Mostrar usuarios originales de la API
    async function cargarUsuariosApi() {
      try {
        const res = await fetch("https://jsonplaceholder.typicode.com/users");
        const usuarios = await res.json();

        usuariosApiDiv.innerHTML = "";
        usuarios.forEach(user => {
          usuariosApiDiv.innerHTML += crearCard(user);
        });
      } catch (error) {
        usuariosApiDiv.innerHTML = `<p class="text-danger">Error al cargar usuarios.</p>`;
        console.error(error);
      }
    }

    // Generar card de usuario
    function crearCard(user) {
      return `
        <div class="col-md-6">
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${user.name}</h5>
              <p class="card-text">
                <strong>Email:</strong> ${user.email}<br>
                <strong>ID:</strong> ${user.id}
              </p>
            </div>
          </div>
        </div>
      `;
    }

    // Mostrar usuarios enviados manualmente
    function actualizarListaNuevos() {
      usuariosNuevosDiv.innerHTML = "";
      usuariosNuevos.forEach(user => {
        usuariosNuevosDiv.innerHTML += crearCard(user);
      });
    }

    // Guardar en localStorage
    function guardarLocal() {
      localStorage.setItem("usuariosNuevos", JSON.stringify(usuariosNuevos));
    }

    // Enviar datos con POST y generar ID único local
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;

      const datos = {
        name: nombre,
        email: email
      };

      try {
        const res = await fetch("https://jsonplaceholder.typicode.com/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(datos)
        });

        const resultado = await res.json();

        // Generar ID único local
        const ultimoId = usuariosNuevos.length > 0
          ? Math.max(...usuariosNuevos.map(u => u.id))
          : 200;

        const nuevoUsuario = {
          id: ultimoId + 1,
          name: nombre,
          email: email
        };

        // Mostrar mensaje
        respuestaDiv.classList.remove("d-none", "alert-danger");
        respuestaDiv.classList.add("alert-info");
        respuestaDiv.textContent = `Usuario agregado. ID asignado localmente: ${nuevoUsuario.id}`;

        usuariosNuevos.push(nuevoUsuario);
        guardarLocal();
        actualizarListaNuevos();

        form.reset();

      } catch (error) {
        respuestaDiv.classList.remove("d-none");
        respuestaDiv.classList.replace("alert-info", "alert-danger");
        respuestaDiv.textContent = "Error al enviar los datos.";
        console.error(error);
      }
    });

    // Al cargar la página
    cargarUsuariosApi();
    actualizarListaNuevos();
  </script>
</body>
</html>
