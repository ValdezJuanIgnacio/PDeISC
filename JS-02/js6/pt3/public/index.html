<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscador de Usuarios</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #f8f9fa;
    }

    .card {
      margin-bottom: 1rem;
    }

    .container {
      max-width: 800px;
    }
  </style>
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-4">Lista de Usuarios</h1>

    <div class="mb-4">
      <input
        type="text"
        class="form-control"
        id="buscador"
        placeholder="Buscar:"
      />
    </div>

    <div id="listaUsuarios" class="row"></div>
  </div>

  <!-- Bootstrap JS (opcional, por si usás componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    class UsuarioManager {
      constructor() {
        this._usuarios = [];
      }

      set usuarios(data) {
        this._usuarios = data;
      }

      get usuarios() {
        return this._usuarios;
      }

      filtrarPorNombre(nombre) {
        return this._usuarios.filter(usuario =>
          usuario.name.toLowerCase().includes(nombre.toLowerCase())
        );
      }
    }

    const manager = new UsuarioManager();
    const buscador = document.getElementById("buscador");
    const listaDiv = document.getElementById("listaUsuarios");

    fetch("https://jsonplaceholder.typicode.com/users")
      .then(res => res.json())
      .then(data => {
        manager.usuarios = data;
        mostrarUsuarios(manager.usuarios);
      });

    function mostrarUsuarios(usuarios) {
      listaDiv.innerHTML = "";
      if (usuarios.length === 0) {
        listaDiv.innerHTML = `<p class="text-muted">No se encontraron usuarios.</p>`;
        return;
      }

      usuarios.forEach(user => {
        const col = document.createElement("div");
        col.className = "col-md-6";

        const card = document.createElement("div");
        card.className = "card shadow-sm";

        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${user.name}</h5>
            <p class="card-text">
              <strong>Email:</strong> ${user.email}<br>
              <strong>Teléfono:</strong> ${user.phone}<br>
              <strong>Empresa:</strong> ${user.company.name}
            </p>
          </div>
        `;

        col.appendChild(card);
        listaDiv.appendChild(col);
      });
    }

    buscador.addEventListener("input", () => {
      const texto = buscador.value.trim();
      const filtrados = manager.filtrarPorNombre(texto);
      mostrarUsuarios(filtrados);
    });
  </script>
</body>
</html>
