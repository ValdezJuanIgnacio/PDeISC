<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4 text-center">Gestión de Alumnos</h1>

    <form id="alumnoForm" class="row g-3 mb-4">
      <div class="col-md-5">
        <input type="text" id="name" class="form-control" placeholder="Nombre" required>
      </div>
      <div class="col-md-5">
        <input type="number" id="age" class="form-control" placeholder="Edad" required>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-success">Agregar</button>
      </div>
    </form>

    <div id="message" class="mb-4"></div>

    <div class="row" id="alumnoList"></div>
  </div>

  <script src="script/script.js"></script>
</body>
</html>
