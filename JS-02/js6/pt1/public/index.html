<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuarios con Fetch y Axios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-5 text-center">Usuarios desde API pública</h1>

    <div class="row g-4">

      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-danger text-white text-center fw-semibold">
            Usuarios obtenidos con <span class="fst-italic">fetch()</span>
          </div>
          <ul class="list-group list-group-flush" id="usuariosFetch">
            <li class="list-group-item text-muted text-center">Cargando datos...</li>
          </ul>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center fw-semibold">
            Usuarios obtenidos con <span class="fst-italic">axios</span>
          </div>
          <ul class="list-group list-group-flush" id="usuariosAxios">
            <li class="list-group-item text-muted text-center">Cargando datos...</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script/fetch.js"></script>

  <script src="script/axios.js"></script>

</body>
</html>
